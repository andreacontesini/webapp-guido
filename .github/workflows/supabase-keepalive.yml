# Tiene attivo il progetto Supabase sul piano gratuito, che va in pausa
# dopo 7 giorni senza attività: ogni 3 giorni chiama la funzione `ping()`
# (vedi supabase/migrations/20261111120000_ping.sql).
#
# Segreti da impostare su GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       → stesso valore di NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  → stesso valore di NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Supabase keep-alive

on:
  schedule:
    # Alle 06:00 UTC dei giorni 1, 4, 7, … del mese (al massimo 4 giorni di pausa a fine mese).
    - cron: "0 6 */3 * *"
  # Avvio manuale dalla scheda Actions, utile per provarlo.
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping del database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Segreti SUPABASE_URL e SUPABASE_ANON_KEY mancanti"
            exit 1
          fi
          # --fail: se il database non risponde il job fallisce e GitHub manda un'email.
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Database Supabase attivo."
